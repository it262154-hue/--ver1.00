<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>異世界自販機 〜勇者様、お金を入れてください〜</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <header id="hud" class="hud">
    <div class="hud-row">
      <div class="hud-id"><span id="h-name" class="hud-name"></span><span class="hud-lv">Lv<b id="h-lv"></b></span></div>
      <div class="hud-bars">
        <div class="bar-line"><span class="bar-label">HP</span><div class="bar hp"><i id="h-hpbar"></i><span id="h-hp"></span></div></div>
        <div class="bar-line"><span class="bar-label">EXP</span><div class="bar exp"><i id="h-expbar"></i><span id="h-exp"></span></div></div>
      </div>
      <div class="hud-gold">💰 <b id="h-gold"></b> G</div>
      <div class="hud-equip"><span id="h-weapon"></span><span id="h-armor"></span></div>
      <div class="hud-audio"><button id="btn-bgm" class="mini" aria-label="BGM切り替え">🎵</button><button id="btn-sfx" class="mini" aria-label="効果音切り替え">🔊</button></div>
    </div>
    <div class="hud-row2"><div id="h-status" class="chips"></div><button id="h-ticker" class="ticker" aria-label="ログを開く">📜</button></div>
  </header>
  <main id="main">
    <section id="view-vending" class="view active" aria-label="自販機"></section>
    <section id="view-battle" class="view" aria-label="バトル"></section>
  </main>
  <nav id="taskbar" class="taskbar" aria-label="メニュー">
    <button data-view="vending" class="on"><span>🏪</span>自販機</button>
    <button data-view="battle"><span>⚔️</span>バトル</button>
    <button id="tb-inv"><span>🎒</span>持ち物</button>
    <button id="tb-dex"><span>📖</span>図鑑</button>
    <button id="tb-ach"><span>🏆</span>実績</button>
    <button id="tb-set"><span>⚙️</span>設定</button>
  </nav>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="fx-layer"></div>
<noscript>このゲームはJavaScriptが必要です。</noscript>
<script>
'use strict';
/* =====================================================================
   異世界自販機 〜勇者様、お金を入れてください〜
   p1: 定数・商品データ
   ===================================================================== */
const SAVE_KEY = 'isekai-vending-save-v1';
const SAVE_VER = 1;
const MAX_LV = 40;
const HP_PER_LV = 18;
const RARITY = {
  common: 'Common', uncommon: 'Uncommon', rare: 'Rare', epic: 'Epic',
  legendary: 'Legendary', cursed: 'Cursed', mystery: '???'
};
const CATS = [
  { id: 'all', name: 'すべて', icon: '🏪' },
  { id: 'potion', name: '回復薬', icon: '🧪' },
  { id: 'weapon', name: '武器', icon: '⚔️' },
  { id: 'armor', name: '防具', icon: '🛡️' },
  { id: 'drink', name: '飲料', icon: '🥤' },
  { id: 'food', name: '食品', icon: '🍙' },
  { id: 'magic', name: '魔法道具', icon: '🔮' },
  { id: 'gag', name: 'ネタ商品', icon: '🪨' },
  { id: 'curse', name: '呪物', icon: '💀' },
  { id: 'rare', name: 'レア商品', icon: '💎' },
  { id: 'mystery', name: '謎の商品', icon: '❓' }
];
const CAT_NAME = Object.fromEntries(CATS.map(c => [c.id, c.name]));

/* 効果ショートハンド */
const heal = v => ({ t: 'heal', v });
const healP = v => ({ t: 'healPct', v });
const cure = s => ({ t: 'cure', s });
const st = (s, n, o) => Object.assign({ t: 'st', s, n, to: 'self' }, o);
const est = (s, n, c, o) => Object.assign({ t: 'st', s, n, c: c == null ? 1 : c, to: 'enemy' }, o);
const dmg = (v, el, o) => Object.assign({ t: 'dmg', v, el }, o);
const msg = text => ({ t: 'msg', text });
const maybe = (c, ok, fail) => ({ t: 'maybe', c, ok, fail });

const ITEMS = [];
function I(id, name, cat, price, rar, icon, desc, o) {
  ITEMS.push(Object.assign({
    id, name, cat, price, rar, icon, desc,
    type: 'consumable', battle: true, field: true, effects: []
  }, o || {}));
}

/* ---------- 回復薬 ---------- */
I('small-potion', '小さなポーション', 'potion', 30, 'common', '🧪', 'HPを少し回復する。駆け出し勇者の味方。', { effects: [heal(30)] });
I('potion', 'ポーション', 'potion', 80, 'common', '🧪', 'HPを中程度回復する。定番商品。', { effects: [heal(80)] });
I('hi-potion', '高級ポーション', 'potion', 220, 'uncommon', '⚗️', 'HPを大きく回復する。ラベルが金色。', { effects: [heal(200)], un: { lv: 4 } });
I('mega-potion', 'ハイパーポーション', 'potion', 420, 'rare', '🧴', 'HPを大きく回復する（450）。上級者向けの大瓶。', { effects: [heal(450)], un: { lv: 14 } });
I('elixir', 'エリクサー', 'potion', 700, 'epic', '🍾', 'HPを全回復し、状態異常も治す。在庫限り。', { effects: [healP(100), cure('all')], un: { lv: 10 }, stock: 3 });
I('mana-soda', 'マナ風ソーダ', 'potion', 60, 'uncommon', '🥤', 'HPを少し回復。シュワッと魔力が弾けると攻撃力も上がる（かも）。', { effects: [heal(35), maybe(0.5, [st('atkUp', 3)], [msg('ただの炭酸だった。')])] });
I('healing-milk', '癒やしの牛乳', 'potion', 70, 'uncommon', '🥛', 'HPを回復し、毒を解除する。腰に手を当てて飲もう。', { effects: [heal(60), cure('poison')] });
I('hero-drink', '勇者の栄養ドリンク', 'potion', 110, 'uncommon', '🍶', 'HPを回復し、一定ターン攻撃力が上がる。', { effects: [heal(50), st('atkUp', 4)] });
I('strange-jelly', '怪しいゼリー', 'potion', 45, 'uncommon', '🟣', '回復量がランダム。当たり外れが激しい。', { effects: [{ t: 'healRand', min: 5, max: 110 }] });
I('holy-water', '聖水', 'potion', 90, 'rare', '💧', '状態異常を治し、アンデッドに大ダメージ。', { effects: [cure('all'), dmg(20, 'holy', { tag: 'undead', m: 3.5, only: true })] });
I('expired-potion', '賞味期限切れポーション', 'potion', 12, 'common', '☠️', '安い。効くこともあるが、外すと毒。賞味期限？ 異世界にその概念はない。', { expired: true, effects: [maybe(0.55, [heal(90)], [msg('ひどい味だ…毒を受けた！'), st('poison', 4)])] });
I('antidote-herb', '解毒草', 'potion', 25, 'common', '🌿', '毒を治し、少しだけHPを回復する。', { effects: [cure('poison'), heal(10)] });

/* ---------- 武器 ---------- */
const W = 'weapon';
I('wooden-stick', '木の棒', W, 0, 'common', '🪵', '初期装備。拾った棒。', { type: 'weapon', atk: 2, noShop: true, battle: false });
I('rusty-sword', '錆びた剣', W, 120, 'common', '🗡️', '錆びているが剣は剣。', { type: 'weapon', atk: 6 });
I('iron-sword', '鉄の剣', W, 350, 'uncommon', '⚔️', '信頼と実績の鉄製。', { type: 'weapon', atk: 11, un: { lv: 3 } });
I('hero-sword', '勇者の剣', W, 1500, 'rare', '🗡️', '勇者の名にふさわしい聖なる刃。', { type: 'weapon', atk: 20, el: 'holy', crit: 0.05, un: { lv: 10 }, sp: '聖属性 / 会心+5%' });
I('slime-sword', 'スライムソード', W, 420, 'uncommon', '🟢', 'ぷるぷる刃。25%で敵を毒にする。', { type: 'weapon', atk: 9, onHit: { s: 'poison', c: 0.25, n: 3 }, un: { def: 'slime' }, sp: '25%で毒' });
I('legendary-leek', '伝説のネギ', W, 800, 'epic', '🧅', 'なぜか伝説。会心が出やすい。', { type: 'weapon', atk: 8, crit: 0.3, un: { lv: 5 }, sp: '会心+30%' });
I('harisen-blade', 'ハリセンブレード', W, 260, 'uncommon', '📜', 'スパーン！ 25%で敵を混乱させる。', { type: 'weapon', atk: 7, onHit: { s: 'confuse', c: 0.25, n: 2 }, sp: '25%で混乱' });
I('cardboard-greatsword', '段ボール製の大剣', W, 90, 'common', '📦', '安いのに強い。ただし8%で壊れる。', { type: 'weapon', atk: 12, brk: 0.08, sp: '攻撃時8%で壊れる' });
I('talking-sword', 'しゃべる剣', W, 600, 'rare', '💬', '攻撃のたびに一言しゃべる。うるさい。', { type: 'weapon', atk: 14, quips: ['「斬れ味より口が立つ！」', '「ワシを買ったのは正解じゃぞ」', '「今の当たり？ 当たりだよな？」', '「おい、手入れしろ」', '「自販機で買われた剣ってワシだけ？」'], sp: '攻撃時にしゃべる' });
I('wrench', '自販機の補充用レンチ', W, 520, 'rare', '🔧', '機械系の敵に1.8倍ダメージ。', { type: 'weapon', atk: 12, bonus: { tag: 'machine', m: 1.8 }, sp: '機械特効' });
I('maou-fork', '魔王のフォーク', W, 2800, 'epic', '🍴', '魔王が愛用していた食事用の三叉槍。闇属性。', { type: 'weapon', atk: 28, el: 'dark', un: { def: 'maou' }, sp: '闇属性' });
I('thunder-spear', '雷鳴の槍', W, 1800, 'epic', '🔱', '雷属性。20%で敵を麻痺させる。', { type: 'weapon', atk: 24, el: 'thunder', onHit: { s: 'para', c: 0.2, n: 2 }, un: { lv: 14 }, sp: '雷属性 / 20%で麻痺' });
I('fire-staff', '炎の杖', W, 1200, 'rare', '🪄', '火属性の杖。氷の敵によく効く。', { type: 'weapon', atk: 18, el: 'fire', un: { lv: 8 }, sp: '火属性' });
I('cursed-umbrella', '呪われた傘', 'curse', 700, 'cursed', '☂️', '強力だが、攻撃のたび持ち主も少し傷つく。', { type: 'weapon', atk: 17, self: 0.03, sp: '攻撃時に最大HPの3%を失う' });
I('returned-legend', '返品された伝説の武器', W, 5000, 'legendary', '🏷️', '強力だが20%の確率で攻撃を拒否する。返品不可。', { type: 'weapon', atk: 36, refuse: 0.2, un: { lv: 16 }, stock: 1, unique: true, sp: '20%で攻撃拒否' });
I('invisible-sword', '透明な剣', 'rare', 3500, 'epic', '👻', '見えない。買ったかどうかも不安になる。敵の防御を40%無視。', { type: 'weapon', atk: 26, pierce: 0.4, un: { lv: 15 }, sp: '防御無視40%' });
I('plain-stick', 'ただの棒', 'gag', 8, 'common', '🥢', 'ただの棒。ネタ商品だが、握ると少し強い。', { type: 'weapon', atk: 3 });

/* ---------- 防具 ---------- */
const A = 'armor';
I('cloth-clothes', '布の服', A, 60, 'common', '👕', '普通の服。気持ち程度の防御。', { type: 'armor', def: 3 });
I('leather-armor', '革の鎧', A, 200, 'common', '🥋', '軽くて丈夫。', { type: 'armor', def: 7, un: { lv: 2 } });
I('iron-armor', '鉄の鎧', A, 600, 'uncommon', '🛡️', '重いが堅い。', { type: 'armor', def: 14, un: { lv: 5 } });
I('slime-armor', 'スライムアーマー', A, 520, 'uncommon', '🟩', 'ぷよぷよ。毒を50%防ぐ。', { type: 'armor', def: 10, res: { poison: 0.5 }, un: { def: 'slime' }, sp: '毒耐性50%' });
I('cardboard-armor', '段ボールアーマー', A, 70, 'common', '📦', '安い。8%で攻撃を回避できる。', { type: 'armor', def: 6, dodge: 0.08, sp: '回避8%' });
I('magic-robe', '魔法のローブ', A, 900, 'rare', '🧥', '最大HP+30。混乱耐性50%。', { type: 'armor', def: 9, hp: 30, res: { confuse: 0.5 }, un: { lv: 7 }, sp: 'HP+30 / 混乱耐性' });
I('pot-lid', '伝説の鍋のふた', A, 1100, 'epic', '🍲', '伝説の盾。12%で攻撃を防ぐ。', { type: 'armor', def: 12, dodge: 0.12, un: { lv: 9 }, sp: '回避12%' });
I('cursed-cloak', '呪いのマント', 'curse', 1400, 'cursed', '🦇', '防御は高いが攻撃力が-5される。', { type: 'armor', def: 22, atkMod: -5, un: { lv: 12 }, sp: '攻撃力-5' });
I('vm-panel', '自販機の外装パネル', A, 2200, 'epic', '🥫', '機械系の敵のダメージを40%軽減。', { type: 'armor', def: 28, vsTag: { tag: 'machine', m: 0.6 }, un: { def: 'vm-guardian' }, sp: '機械から受けるダメージ-40%' });
I('maou-pajamas', '魔王のパジャマ', A, 3200, 'epic', '🌙', '毎ターンHP+4。麻痺耐性50%。もこもこ。', { type: 'armor', def: 20, regen: 4, res: { para: 0.5 }, un: { def: 'maou' }, sp: 'リジェネ4 / 麻痺耐性' });

/* ---------- 飲料 ---------- */
const D = 'drink';
I('water', '普通の水', D, 15, 'common', '💧', 'ただの水。ただの水は偉大。', { effects: [heal(15)] });
I('premium-water', '高級ミネラルウォーター', D, 60, 'uncommon', '🧊', 'HPを回復し毒を消す。高い水。', { effects: [heal(35), cure('poison')] });
I('legend-water', '伝説の水', D, 400, 'legendary', '🌊', 'HP全回復。飲むと最大HPが+8（最大3回まで）。', { effects: [healP(100), { t: 'perm', stat: 'maxHp', v: 8, max: 3 }], un: { p: 12 }, stock: 2 });
I('energy', 'エナジードリンク', D, 80, 'common', '⚡', '攻撃力アップ3ターン。少し回復。', { effects: [st('atkUp', 3), heal(10)] });
I('expired-energy', '賞味期限切れエナジードリンク', D, 25, 'common', '☠️', '攻撃力が5ターン上がる…かもしれない。外すと混乱。', { expired: true, effects: [maybe(0.6, [st('atkUp', 5), heal(20)], [msg('頭がぐるぐるする！'), st('confuse', 3)])] });
I('isekai-coffee', '異世界コーヒー', D, 55, 'uncommon', '☕', '麻痺と混乱を治し、少し回復。', { effects: [cure('para'), cure('confuse'), heal(20)] });
I('maou-coffee', '魔王ブレンドコーヒー', D, 150, 'rare', '🖤', '攻撃力+4ターン。代償に防御が2ターン下がる。', { effects: [st('atkUp', 4), st('defDown', 2)], un: { lv: 12 } });
I('slime-soda', 'スライム味ソーダ', D, 40, 'common', '🟢', 'HPを回復。スライム系の敵が仲間だと思って攻撃をためらう。', { effects: [heal(25), { t: 'tagSkip', tag: 'slime' }] });
I('dragon-energy', 'ドラゴンエナジー', D, 300, 'epic', '🐉', '攻撃力5ターン。飲むと攻撃力が+1（最大3回）。', { effects: [st('atkUp', 5), heal(50), { t: 'perm', stat: 'baseAtk', v: 1, max: 3 }], un: { lv: 11 }, stock: 3 });
I('hero-sports', '勇者専用スポーツドリンク', D, 120, 'rare', '🏅', '防御力4ターン上昇。HP回復。', { effects: [st('defUp', 4), heal(40)], stock: 4, un: { lv: 6 } });
I('tear-juice', '涙味のジュース', D, 35, 'common', '😢', 'しょっぱい。HP回復と混乱解除。', { effects: [heal(30), cure('confuse')] });
I('eternal-tea', '永遠に冷たいお茶', D, 70, 'uncommon', '🍵', '敵にぶつけると氷ダメージ。飲めば回復。', { effects: [dmg(30, 'ice'), heal(20)] });
I('hot-tea', '熱すぎる紅茶', D, 65, 'uncommon', '🫖', '敵にかけると火ダメージ。', { effects: [dmg(35, 'fire')], field: false });
I('clear-cola', '透明なコーラ', D, 95, 'uncommon', '🫧', '次の攻撃が必ず会心になる。', { effects: [{ t: 'nextCrit' }], field: false });
I('dream-milk', '夢が見られる牛乳', D, 130, 'uncommon', '🌙', 'HPを大きく回復。30%で眠ってしまう（麻痺）。', { effects: [heal(90), maybe(0.3, [st('para', 1), msg('ぐっすり夢を見てしまった…')], [])] });
I('maker-halfdrunk', '製作者の飲みかけ', 'gag', 200, 'rare', '🥤', '製作者の飲みかけ。HP回復と攻撃力アップ。', { maker: true, effects: [heal(40), st('atkUp', 3), { t: 'story', id: 'makerDrink' }] });

/* ---------- 食品 ---------- */
const F = 'food';
I('onigiri', 'おにぎり（異世界産）', F, 25, 'common', '🍙', '具は不明。HPを回復。', { effects: [heal(40)] });
I('drink-curry', '飲むカレー', F, 75, 'uncommon', '🍛', 'HP回復と攻撃力アップ。', { effects: [heal(60), st('atkUp', 3)] });
I('dragon-jerky', 'ドラゴンジャーキー', F, 140, 'rare', '🥩', 'HP回復と防御力アップ。噛みごたえ抜群。', { effects: [heal(80), st('defUp', 4)], un: { lv: 8 } });
I('slime-jelly', '食用スライム', F, 35, 'common', '🍮', 'ぷるぷる。HPと毒を回復。', { effects: [heal(35), cure('poison')] });
I('expired-bento', '賞味期限切れ弁当', F, 20, 'common', '🍱', '大回復か、毒と攻撃ダウン。', { expired: true, effects: [maybe(0.5, [heal(100)], [msg('お腹が…！'), st('poison', 5), st('atkDown', 3)])] });
I('negi-yaki', 'ネギ焼き', F, 90, 'uncommon', '🥞', 'HP回復と次の攻撃が会心。', { effects: [heal(50), { t: 'nextCrit' }] });
I('manju', '異世界まんじゅう', F, 50, 'common', '🥟', 'HP回復。ときどき小銭が入っている。', { effects: [heal(45), maybe(0.25, [{ t: 'gold', v: 12 }], [])] });

/* ---------- 魔法道具 ---------- */
const M = 'magic';
I('fire-scroll', '炎の巻物', M, 100, 'uncommon', '📜', '敵に火ダメージ（戦闘中のみ）。', { effects: [dmg(60, 'fire')], field: false });
I('ice-scroll', '氷の巻物', M, 100, 'uncommon', '❄️', '氷ダメージ＋敵の攻撃力を下げる。', { effects: [dmg(45, 'ice'), est('atkDown', 3)], field: false });
I('thunder-scroll', '雷の巻物', M, 140, 'rare', '⚡', '雷ダメージ。30%で麻痺。', { effects: [dmg(70, 'thunder'), est('para', 2, 0.3)], field: false, un: { lv: 7 } });
I('smoke-ball', 'けむり玉', M, 70, 'common', '💨', 'この戦闘中、逃走成功率が大きく上がる。', { effects: [{ t: 'fleeUp', v: 0.4 }], field: false });
I('mirror-shard', '鏡の欠片', M, 120, 'uncommon', '🪞', '次の敵の攻撃を60%反射する。', { effects: [{ t: 'reflect' }], field: false });
I('sleep-powder', 'しびれ粉', M, 90, 'uncommon', '🧂', '80%で敵を麻痺させる。', { effects: [est('para', 3, 0.8)], field: false });
I('armor-spray', '装甲スプレー', M, 80, 'common', '🧴', '敵の防御力を4ターン下げる。', { effects: [est('defDown', 4)], field: false });

/* ---------- ネタ商品 ---------- */
const G = 'gag';
I('nothing-stone', '何も起きない石', G, 5, 'common', '🪨', '何も起きない。それが仕様。', { type: 'collect', effects: [msg('石を見つめた。何も起きなかった。')] });
I('fancy-stone', '高級な石', G, 500, 'rare', '💎', '高いだけの石。投げれば痛い。', { type: 'collect', effects: [dmg(45, null)], field: false, consumeOnUse: true });

/* ---------- 経験値・レベルアップ ---------- */
let lvGain = null;

  const p = S.player;
  if (p.level >= MAX_LV) { const g = Math.floor(n * 0.5); addGold(g); log(`レベル上限のため、経験値${n}が${g}Gに換算された。`); return; }

}

  const p = S.player; const before = p.level;

  p.level++;
  const dAtk = p.level % 2 === 0 ? 3 : 2, dDef = p.level % 3 === 0 ? 2 : 1;

  lvGain.hp += HP_PER_LV; lvGain.atk += dAtk; lvGain.def += dDef; lvGain.to = p.level;

}

    giveItem(id, 1);                                                           // 7. 所持品
    if (S.atari && !opts.special) { S.atari = false; if (!isEquip(it) && it.type !== 'key') { giveItem(id, 1); log('🎯 当たり！ もう1個おまけ！', 'ev'); toast('🎯 当たり！ おまけ付き'); } else { addGold(Math.floor(price * 0.3)); log('🎯 当たり！ キャッシュバック。', 'ev'); } }
    S.stats.purchases++; S.stats.buyStreak++; S.stats.noBuyVisits = 0; S.stats.winsNoBuy = 0;   // 8. 購入回数
    S.buyCount[id] = (S.buyCount[id] || 0) + 1; S.lastBuyId = id; S.buyOrder.push(id); if (S.buyOrder.length > 6) S.buyOrder.shift();
    log(`🛒 ${it.name}を${price}Gで購入。`, 'buy');                                 // 9. ログ
    say(it.cat === 'gag' ? '……ネタ商品をお買い上げ。気が合いますね。' : vmLine('buy'));
    if (typeof sfx === 'function') sfx(['epic', 'legendary', 'cursed', 'mystery'].includes(it.rar) ? 'rare' : 'buy');
    if (typeof vendFx === 'function') vendFx(it);
    if (S.quota) { S.quota.done++; if (S.quota.done >= S.quota.need) { addGold(S.quota.reward); log(`📋 ノルマ達成！ ${S.quota.reward}G獲得。`, 'ev'); toast(`📋 ノルマ達成！ +${S.quota.reward}G`); S.quota = null; } }
    tick(1);
  } finally { setTimeout(() => { buyLock = false; }, 200); }
  // 10. 関連イベント・実績
  if (it.id === 'cursed-soda') triggerEvent('blackout');
  else if (it.cat === 'gag' && chance(0.5)) triggerEvent('gag-joy');
  else if (!opts.special && S.stats.buyStreak >= 3 && S.stats.buyStreak % 3 === 0) triggerEvent('combo');
  else rollVendingEvent('buy');
  checkAutoEvents(); checkUnlocks(); checkAchievements();
  refresh();                                                                   // 11. 再描画
  return true;
}

const restCost = () => 10 + S.player.level * 2;
function restAtBench() {

  if (S.player.gold < cost) return buyFail(`ベンチの利用料が足りない（${cost}G）`);
  S.player.gold -= cost; const d = healPlayer(Math.max(20, totalMaxHp() * 0.4));
  S.player.status = {}; log(`🪑 ベンチで休憩（${cost}G）。HPが${d}回復した。`); say('ベンチ利用料です。座り心地は保証しません。');
  if (typeof sfx === 'function') sfx('heal'); tick(1); refresh();
}
const normCmd = t => (t || '').normalize('NFKC').trim().toLowerCase().replace(/\s+/g, '');
function runCommand(raw) {
  const c = normCmd(raw);
  if (!c) return 'コードを入力してください。';
  if (c === 'maougakita') {
    if (!S.flags.couponCode) { say('そのコードは、まだ届いていませんが？'); return '無効なコードです。'; }
    if (S.flags.couponUsed) return 'このクーポンは使用済みです。';

  }
  if (['debug', 'ばぐ', 'bug', 'バグ'].includes(c)) {
    if (S.player.level < 10) { say('まだ早いです。もう少し強くなってからにしてください。'); return 'Lv10以上で有効になるようだ…。'; }
    if (S.flags.debugCmd) return 'すでに実行済みだ。';
    S.flags.debugCmd = true; triggerEvent('debug-cmd'); return 'DEBUG MODE: ■■■';
  }
  if (c === 'uuddlrlrba') { konamiCommand(); return '……！'; }
  if (c === 'maker' || c === '製作者') { S.flags.makerMet = true; say(pick(['製作者は今、締切と戦っています。', '製作者にクレームは受け付けていません。'])); checkAchievements(); return '製作者はここにはいない。たぶん。'; }
  if (c === 'ひらけごま') { say('異世界の扉は開きませんでした。ここは自販機です。'); return '何も起きなかった。'; }
  if (c === '自販機' || c === 'vm') { say('呼びましたか？ ご注文は？'); return '自販機が返事をした。'; }
  say('そのコードは存在しません。メンテナンス中ではありません。'); return '不明なコードです。';
}
function konamiCommand() {
  if (S.flags.konami) { toast('あの呪文はもう唱えた。'); return; }
  S.flags.konami = true; triggerEvent('konami');
}

/* ---------- イベント実行エンジン ---------- */
function evEligible(ev) {
  if (ev.once && S.evDone[ev.id]) return false;
  if (S.lastEvent === ev.id) return false;
  if (ev.cd && S.evCd[ev.id] != null && S.clock - S.evCd[ev.id] < ev.cd) return false;
  try { if (ev.cond && !ev.cond()) return false; } catch (e) { return false; }
  return true;
}
async function triggerEvent(id) {
  const ev = VEVM[id]; if (!ev || evBusy || (B && !B.over)) return false;
  evBusy = true;
  try {
    S.disc.events[id] = (S.disc.events[id] || 0) + 1; S.evCd[id] = S.clock; if (ev.once) S.evDone[id] = true; S.lastEvent = id;
    if (typeof sfx === 'function') sfx(ev.kind === 'horror' ? 'eerie' : ev.kind === 'secret' ? 'secret' : 'event');
    await ev.run();
  } catch (e) { console.error('event error', id, e); }
  finally { evBusy = false; checkAchievements(); checkUnlocks(); refresh(); }
  return true;
}
function rollVendingEvent(trigger) {
  if (evBusy || uiLocked || curView !== 'vending' || (B && !B.over)) return;
  if (!chance(trigger === 'buy' ? 0.3 : 0.4)) return;
  const c = VEV.filter(e => !e.auto && !e.manual && evEligible(e));
  const ev = wpick(c, e => e.w); if (ev) triggerEvent(ev.id);
}
function checkAutoEvents() {
  if (evBusy || curView !== 'vending' || (B && !B.over)) return;
  for (const ev of VEV) if (ev.auto && evEligible(ev)) { triggerEvent(ev.id); return; }
}

const modalStack = [];
function openModal(o) {

  m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  const head = el('div', 'modal-head'); head.appendChild(el('h2', '', o.title || ''));
  const api = { el: m, back, body: null, render: null, close() { const i = modalStack.indexOf(api); if (i >= 0) modalStack.splice(i, 1); const li = liveRenders.indexOf(api.render); if (li >= 0) liveRenders.splice(li, 1); back.remove(); if (o.onClose) o.onClose(); } };
  if (o.closable !== false) { const x = el('button', 'modal-x', '✕'); x.setAttribute('aria-label', '閉じる'); x.onclick = () => api.close(); head.appendChild(x); }
  const body = el('div', 'modal-body'); api.body = body;
  m.appendChild(head); m.appendChild(body);
  if (o.render) { api.render = () => { const st = body.scrollTop; body.textContent = ''; o.render(body, api); body.scrollTop = st; }; api.render(); liveRenders.push(api.render); }
  else if (o.body) body.appendChild(o.body);

  back.appendChild(m);

  root.appendChild(back); modalStack.push(api); api.closable = o.closable !== false;
  const first = m.querySelector('button.btn,button'); if (first) setTimeout(() => { try { first.focus({ preventScroll: true }); } catch (e) {} }, 30);
  return api;
}

function enemyStats(e, lv) {
  return {
    hp: Math.floor((20 + lv * 12 + lv * lv * 0.6) * e.hm), atk: Math.floor((5 + lv * 2.5) * e.am), def: Math.floor((1 + lv * 1.05) * e.dm),
    exp: Math.floor((10 + lv * 8 + lv * lv * 1.6) * e.xm * (e.boss ? 4 : 1)), gold: Math.floor((8 + lv * 5 + lv * lv * 0.3) * e.gm * (e.boss ? 5 : 1))
  };
}
function makeEnemy(def, lv) {
  const s = enemyStats(def, lv);
  return {
    id: def.id, name: def.name, icon: def.icon, desc: def.desc, lv, boss: def.boss, noFlee: def.noFlee, tags: def.tags.slice(), weak: def.weak, res: def.res, resPhys: def.resPhys,
    hp: s.hp, maxHp: s.hp, atk: s.atk, def: s.def, exp: s.exp, gold: s.gold, drops: def.drops, status: {}, shield: 0, stolen: 0, stolenItems: [],
    guard: false, counter: false, secret: !!def.secret, fast: def.fast || 0, weakItems: def.weakItems || null, big: def.big || null, p: def.p, p2: def.p2 || null, rot: def.rot || null, say: def.say || [], maker: !!def.maker
  };
}
const enemyAvailable = d => condOk(d.req) && (!d.reqFn || d.reqFn());
function pickRandomEnemy() {
  const pl = S.player.level;
  let pool = ENEMIES.filter(e => !e.boss && !e.hidden && e.lv <= pl + 2 && e.lv >= pl - 5), lv = null;
  if (!pool.length) { pool = ENEMIES.filter(e => !e.boss && !e.hidden).sort((a, b) => b.lv - a.lv).slice(0, 8); lv = Math.max(1, pl - 2); }
  const e = wpick(pool, x => 1 / (1 + Math.abs(x.lv - pl)));
  return { def: e, lv: lv ? Math.max(e.lv, lv) : e.lv };
}

function chooseAction() {

  const base = e.rot ? e.rot[Math.floor((B.turn - 1) / 3) % e.rot.length] : (B.phase2 && e.p2 ? e.p2 : e.p);

/* ---------- ダメージ計算 ---------- */
function elemMult(e, el) { if (!el) return 1; if (e.weak === el) return 1.5; if (e.res === el) return 0.5; return 1; }

  let def = e.def * (e.status.defUp ? 1.4 : 1) * (e.status.defDown ? 0.7 : 1); if (w && w.pierce) def *= 1 - w.pierce;
  let d = atk - def * 0.6, note = '';
  const el = (w && w.el) || null; const em = elemMult(e, el); if (em > 1) note += '（弱点！）'; if (em < 1) note += '（耐性）'; d *= em;
  if (w && w.bonus && e.tags.includes(w.bonus.tag)) { d *= w.bonus.m; note += '（特効！）'; }

}
function damageEnemy(d, opts) {

  e.hp = Math.max(0, e.hp - rest);

}
async function hitPlayer(mult, text, a) {
  const e = B.enemy; blog(text, 'bad'); await wait(260);
  const eb = $('#b-enemy'); if (eb) { eb.classList.remove('lunge'); void eb.offsetWidth; eb.classList.add('lunge'); }
  if (B.dodgeNext) { B.dodgeNext = false; blog('しかし、奇跡的に攻撃をかわした！', 'good'); return { hit: false }; }
  const dg = (armor() && armor().dodge) || 0; if (dg && chance(dg)) { blog('ひらりと回避した！', 'good'); return { hit: false }; }
  let atk = e.atk * (e.status.atkUp ? 1.3 : 1) * (e.status.atkDown ? 0.7 : 1) * mult * (B.phase2 && e.boss ? 1.08 : 1);
  const ps = S.player.status; const def = totalDef() * (ps.defUp ? 1.4 : 1) * (ps.defDown ? 0.7 : 1);
  let d = atk * rand(0.9, 1.1) - def * 0.6;

  hurtPlayer(d); blog(`${S.player.name}は${d}ダメージを受けた！${B.defending ? '（防御）' : ''}`, 'bad'); sfx('hurt');
  const pb = $('#b-player'); if (pb) { pb.classList.remove('shake'); void pb.offsetWidth; pb.classList.add('shake'); }

}
function statusOnPlayer(s, c, n) {

/* ---------- 敵の行動 ---------- */
async function runAction(a) {
  const e = B.enemy; const t = a.t; const nm = e.name;
  switch (t) {

    case 'heavy': await hitPlayer(a.m || 1.8, a.txt || `${nm}の強攻撃！`, a); break;
    case 'guard': e.guard = true; blog(`${nm}は身構えた！ 次に受けるダメージが半減する。`); break;
    case 'heal': { const h = Math.max(5, Math.floor(e.maxHp * 0.2)); e.hp = Math.min(e.maxHp, e.hp + h); blog(a.txt ? `${nm}${a.txt}` : `${nm}は自分を回復した！ HP+${h}`, 'bad'); floatText($('#b-enemy'), '+' + h, 'heal'); break; }
    case 'poison': { const r = await hitPlayer(a.m || 0.7, a.txt || `${nm}の毒攻撃！`, a); if (r.hit) statusOnPlayer('poison', a.c || 0.7, a.n || 3); break; }

    case 'sellGold': { const r = await hitPlayer(0.7, a.txt || `${nm}の「ご購入ありがとうございます」！`, a); if (r.hit) { const g = Math.min(S.player.gold, Math.max(5, Math.floor(S.player.gold * 0.08))); if (g > 0) { S.player.gold -= g; e.stolen += g; e.hp = Math.min(e.maxHp, e.hp + Math.floor(e.maxHp * 0.04)); blog(`勝手に${g}G徴収された！`, 'bad'); } } break; }
    case 'stealItem': {

      if (!cands.length) { await hitPlayer(1, `${nm}の噛みつき！`, a); break; }
      const id = pick(cands); removeItem(id, 1); e.stolenItems.push(id); blog(`${nm}が${ITEM[id].name}を盗んだ！（倒せば取り返せる）`, 'bad'); break; }
    case 'seal': B.sealTurns = 3; blog(`${nm}がアイテムを封印した！ 2ターン使えない。`, 'bad'); break;
    case 'selfUp': setStatus(e, 'atkUp', 3); blog(`${nm}は力を溜めた！ 攻撃力アップ！`, 'bad'); break;
    case 'atkDownP': { const r = await hitPlayer(0.7, a.txt || `${nm}の弱体化攻撃！`, a); if (r.hit) statusOnPlayer('atkDown', 0.85, a.n || 3); break; }
    case 'defDownP': { const r = await hitPlayer(0.7, a.txt || `${nm}の防御崩し！`, a); if (r.hit) statusOnPlayer('defDown', 0.85, a.n || 3); break; }

async function enemyTurn() {
  const e = B.enemy; B.prevHp = S.player.hp;
  e.guard = false; if (B.enemyFled) return;
  if (B.enemySleep > 0) { B.enemySleep--; blog(`${e.name}はぐっすり眠っている…`); return; }
  if (B.enemySkip > 0) { B.enemySkip--; blog(`${e.name}は動かなかった。`); return; }
  if (e.status.para && chance(0.4)) { blog(`${e.name}は麻痺して動けない！`, 'good'); return; }
  if (e.status.confuse && chance(0.35)) { const d = Math.max(1, Math.floor(e.maxHp * 0.06)); damageEnemy(d, { silent: true }); blog(`${e.name}は混乱して自分を攻撃した！ ${d}ダメージ`, 'good'); return; }
  const a = B.intent || chooseAction();
  await runAction(a);
  if (S.player.hp <= 0 || e.hp <= 0 || B.enemyFled) return;
  if (e.fast && chance(e.fast)) { blog(`${e.name}は素早く動いた！`, 'bad'); await runAction({ t: 'atk' }); }
}
function tickStatuses(t) { for (const k of Object.keys(t.status || {})) { t.status[k]--; if (t.status[k] <= 0) delete t.status[k]; } }
function endRound() {
  const e = B.enemy;
  if (S.player.hp > 0 && S.player.status.poison) { const d = Math.max(3, Math.floor(totalMaxHp() * 0.05)); hurtPlayer(d); blog(`☠️ 毒で${d}ダメージ！`, 'bad'); }
  const a = armor(); if (a && a.regen && S.player.hp > 0) { const h = healPlayer(a.regen); if (h) blog(`${a.name}の効果でHP+${h}`, 'heal'); }
  if (e.hp > 0 && e.status.poison) { const d = Math.max(2, Math.floor(e.maxHp * 0.06)); damageEnemy(d, { silent: true }); blog(`☠️ ${e.name}は毒で${d}ダメージ！`, 'good'); }
  tickStatuses(S.player); tickStatuses(e); if (B.sealTurns > 0) B.sealTurns--;

}

/* ---------- プレイヤーの行動 ---------- */
async function doAttack() {
  const e = B.enemy, w = weapon();
  if (w && w.refuse && chance(w.refuse)) { blog(`${w.name}「やだ。今日は斬りたくない気分。」 攻撃を拒否された！`, 'bad'); return; }
  blog(`${S.player.name}の攻撃！${w ? `（${w.name}）` : ''}`);
  if (w && w.quips && chance(0.6)) blog(`${w.name}${pick(w.quips)}`, 'quip');
  const pb = $('#b-player'); if (pb) { pb.classList.remove('lunge2'); void pb.offsetWidth; pb.classList.add('lunge2'); }
  await wait(240);
  const r = calcPlayerAttack();
  damageEnemy(r.dmg, { crit: r.crit });
  blog(`${e.name}に${r.dmg}ダメージ！${r.crit ? '【会心の一撃！】' : ''}${r.note}`, r.crit ? 'crit' : 'good'); sfx(r.crit ? 'crit' : 'attack');
  const eb = $('#b-enemy'); if (eb) { eb.classList.remove('hit'); void eb.offsetWidth; eb.classList.add('hit'); }
  if (e.counter) { e.counter = false; const c = Math.max(1, Math.floor(r.dmg * 0.4)); hurtPlayer(c); blog(`${e.name}の反撃！ ${c}ダメージ！`, 'bad'); }
  e.guard = false;
  if (w && w.onHit && e.hp > 0 && chance(enemyStatusChance(w.onHit.s, w.onHit.c))) { setStatus(e, w.onHit.s, w.onHit.n); blog(`${e.name}に${ST[w.onHit.s].ic}${ST[w.onHit.s].n}！`, 'good'); }
  if (w && w.self && S.player.hp > 1) { const sd = Math.min(S.player.hp - 1, Math.max(1, Math.floor(totalMaxHp() * w.self))); hurtPlayer(sd); blog(`${w.name}が生命力を吸った… ${sd}ダメージ`, 'bad'); }
  if (w && w.brk && chance(w.brk)) { blog(`${w.name}が壊れてしまった！`, 'bad'); removeItem(w.id, 1); }
  renderBattleBars();
}
async function playerAction(act, payload) {
  if (!B || B.over || B.busy) return;
  if (act === 'item' && !payload) return;
  B.busy = true; B.inRound = true; B.menu = 'main'; setCmdState(true);
  try {
    const ps = S.player.status; let skipped = false;
    if (act === 'flee' && B.enemy.noFlee) { blog('この戦いからは逃げられない！', 'bad'); sfx('fail'); B.busy = false; B.inRound = false; renderBattle(); return; }
    if (act === 'item' && B.sealTurns > 0) { blog('アイテムは封印されていて使えない！', 'bad'); sfx('fail'); B.busy = false; B.inRound = false; renderBattle(); return; }
    if (ps.para && chance(0.4)) { blog('体がしびれて動けない！', 'bad'); skipped = true; }
    else if (ps.confuse && chance(0.35)) { const d = Math.max(1, Math.floor(totalMaxHp() * 0.06)); hurtPlayer(Math.min(d, Math.max(0, S.player.hp - 1))); blog(`混乱して自分を攻撃してしまった！ ${d}ダメージ`, 'bad'); skipped = true; }
    if (!skipped) {
      if (act === 'attack') { await doAttack(); B.lastAct = 'attack'; }
      else if (act === 'defend') { B.defending = true; B.lastAct = 'defend'; blog(`${S.player.name}は身を守っている…（被ダメージ半減）`, 'good'); sfx('guard'); }
      else if (act === 'item') {
        const ok = useItem(payload, { battle: true });
        if (!ok) { B.busy = false; B.inRound = false; renderBattle(); return; }
        B.lastAct = 'item';
      }
      else if (act === 'flee') {
        const c = clamp(0.45 + B.fleeBonus + (S.player.level - B.enemy.lv) * 0.02, 0.15, 0.9);
        blog(`${S.player.name}は逃げようとした…`);
        if (chance(c)) { await wait(300); finishBattle('flee'); return; }
        blog('逃げられなかった！', 'bad'); B.lastAct = 'flee';
      }
    }
    if (B.enemy.hp <= 0) { finishBattle('win'); return; }
    if (S.player.hp <= 0) { finishBattle('lose'); return; }
    if (B.extraAction) { B.extraAction = false; blog('時空が乱れ、敵のターンが飛ばされた！', 'good'); B.busy = false; B.inRound = false; B.intent = chooseAction(); renderBattle(); refresh(); return; }
    await wait(350);
    await enemyTurn();
    if (B.enemyFled) { finishBattle('enemyFled'); return; }
    if (B.enemy.hp <= 0) { finishBattle('win'); return; }
    if (S.player.hp <= 0) { finishBattle('lose'); return; }
    endRound();
    if (B.enemy.hp <= 0) { finishBattle('win'); return; }
    if (S.player.hp <= 0) { finishBattle('lose'); return; }
    await startRound();
  } catch (err) { console.error(err); if (B && !B.over) { B.busy = false; B.inRound = false; renderBattle(); } }
}

/* ---------- 戦闘イベント ---------- */
async function maybeBattleEvent(when) {
  if (!B || B.over) return;
  let ev = null;
  if (when === 'start') { if (B.enemy.secret) ev = BEV.find(x => x.id === 'boss-secret'); else if (chance(0.22)) ev = wpick(BEV.filter(x => x.when === 'start' && !x.cond || x.when === 'start' && x.cond()), x => x.w); }
  else if (B.turn >= 2 && B.evCount < 3 && chance(0.15)) { ev = wpick(BEV.filter(x => x.when === 'turn' && (!x.cond || x.cond())), x => x.w); }
  if (!ev) return;
  B.evCount++; S.disc.events['b:' + ev.id] = (S.disc.events['b:' + ev.id] || 0) + 1; sfx('event');
  try { await ev.run(); } catch (e) { console.error(e); }
  renderBattleBars(); renderBattle(); await wait(250);
}

function finishBattle(result) {

  const e = B.enemy; const res = { result, exp: 0, gold: 0, drops: [], levelups: [], notes: [] }; B.result = res;
  S.stats.battles++; S.stats.buyStreak = 0; S.disc.enemies[e.id] = 1;
  const def = ENEMY[e.id];
  if (result === 'win' || result === 'enemyFled') {
    if (result === 'enemyFled') { res.notes.push(`${e.name}は逃げてしまった。報酬はない。`); S.stats.winsNoBuy = 0; }
    else {

function initAudio() {

  try {

    AC = new C(); master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination);
    bgmGain = AC.createGain(); bgmGain.gain.value = 0.09; bgmGain.connect(master);

}

}

function setBgmFor() {
  if (!AC || !S.settings.bgm) { stopBgm(); return; }
  const want = (B && !B.over) ? (B.enemy.boss ? 'boss' : 'battle') : 'vending';
  if (want === bgmName && bgmTimer) return;
  stopBgm(); bgmName = want; bgmStep = 0; bgmNext = AC.currentTime + 0.1; bgmTimer = setInterval(bgmSchedule, 90); bgmSchedule();
}
function toggleBgm() { S.settings.bgm = !S.settings.bgm; initAudio(); setBgmFor(); refresh(); }
document.addEventListener('visibilitychange', () => { if (!AC) return; if (document.hidden) AC.suspend().catch(() => {}); else if (S.settings.bgm || S.settings.sfx) AC.resume().catch(() => {}); });

/* ---------- 再描画の統括 ---------- */
function refresh() {
  try {
    renderHUD();
    if (curView === 'vending') renderVending(); else renderBattle();
    for (const f of liveRenders.slice()) { try { f(); } catch (e) { console.error(e); } }
  } catch (e) { console.error(e); }
  saveGame();
}

/* ---------- 初期化 ---------- */
let lastActive = Date.now(), konamiBuf = [];
function init() {
  const loaded = loadGame();
  buildVending(); buildBattleView();
  document.body.classList.toggle('calm', !!S.settings.calm);
  for (const b of document.querySelectorAll('#taskbar [data-view]')) b.onclick = () => switchView(b.dataset.view);
  $('#tb-inv').onclick = openInventory; $('#tb-dex').onclick = openDex; $('#tb-ach').onclick = openAchievements; $('#tb-set').onclick = openSettings;
  $('#h-ticker').onclick = openLog;
  $('#btn-bgm').onclick = () => { toggleBgm(); if (S.settings.bgm) sfx('click'); };
  $('#btn-sfx').onclick = () => { S.settings.sfx = !S.settings.sfx; initAudio(); if (S.settings.sfx) sfx('click'); refresh(); };
  if (!loaded) seedAnnounced();
  say(vmLine('visit'));
  refresh();
  if (!loaded) showIntro(); else { toast('おかえりなさい！ セーブデータを読み込みました。'); checkUnlocks(); checkAchievements(); }
  const wake = () => { initAudio(); setBgmFor(); };
  for (const ev of ['pointerdown', 'keydown']) document.addEventListener(ev, function once() { wake(); document.removeEventListener(ev, once); }, { passive: true });
  for (const ev of ['pointerdown', 'keydown', 'mousemove']) document.addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true });
  setInterval(() => {
    if (curView === 'vending' && !B && !modalStack.length && !evBusy && !uiLocked && Date.now() - lastActive > 45000 && VEVM.nag && evEligible(VEVM.nag)) { lastActive = Date.now(); triggerEvent('nag'); }
  }, 10000);
  document.addEventListener('keydown', e => {
    const tag = (e.target && e.target.tagName) || ''; if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    konamiBuf.push(e.key.length === 1 ? e.key.toLowerCase() : e.key); if (konamiBuf.length > 10) konamiBuf.shift();
    if (konamiBuf.join(',') === 'ArrowUp,ArrowUp,ArrowDown,ArrowDown,ArrowLeft,ArrowRight,ArrowLeft,ArrowRight,b,a') { konamiBuf = []; konamiCommand(); }
  });
  window.addEventListener('beforeunload', () => { saveGame(); });
}
window.addEventListener('DOMContentLoaded', init);
window.addEventListener('error', e => { try { console.error('game error', e.message); } catch (_) {} });

</script>
